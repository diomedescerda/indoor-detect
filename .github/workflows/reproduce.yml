name: Reproduce archived results

on:
  push:
    paths: ['Build/Testing/**', 'development/relocations.json', 'development/annotation_drafts/**', 'scripts/**', 'requirements-analysis.lock.txt', '.github/workflows/reproduce.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  saved-results:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-analysis.lock.txt
      - run: python -m pip install -r requirements-analysis.lock.txt
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python scripts/reproduce.py --overlays
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproduced-results-${{ github.sha }}
          path: development/runs/saved-results/
          if-no-files-found: ignore
          include-hidden-files: true
